<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
    <meta name="theme-color" content="#FFFBF7">
    <meta name="robots" content="noindex, nofollow">
    <title>Order Dashboard — Jannat Baking</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;1,400;1,600&display=swap"
        rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/theme.js"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="bg-background text-text font-sans">

    <div id="sidebar-overlay" class="sidebar-overlay" data-sidebar-close></div>

    <div class="dashboard-grid">
        <!-- ========== SIDEBAR ========== -->
        <aside id="sidebar" class="sidebar flex flex-col">
            <div class="p-6 border-b border-border">
                <a href="index.html" class="flex flex-col">
                    <span class="font-serif text-xl font-bold text-text">
                        <span class="text-primary italic">Jannat</span> Baking
                    </span>
                    <span class="text-[10px] text-text-muted tracking-[0.18em] uppercase font-bold mt-0.5">Admin
                        Panel</span>
                </a>
            </div>

            <nav class="flex-1 py-4" aria-label="Admin">
                <p class="px-6 mb-2 text-[10px] font-bold text-text-muted uppercase tracking-[0.14em]">Main</p>
                <a href="orders.html" class="nav-item active" aria-current="page">
                    <svg width="18" height="18" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01" />
                    </svg>
                    Orders
                    <span id="pending-badge"
                        class="ml-auto bg-primary text-white text-[10px] font-bold px-2 py-0.5 rounded-full hidden">0</span>
                </a>
                <a href="admin.html" class="nav-item">
                    <svg width="18" height="18" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
                    </svg>
                    Products
                </a>

                <p class="px-6 mt-6 mb-2 text-[10px] font-bold text-text-muted uppercase tracking-[0.14em]">Shop</p>
                <a href="index.html" class="nav-item" target="_blank" rel="noopener">
                    <svg width="18" height="18" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                    </svg>
                    View storefront
                </a>
            </nav>

            <div class="sidebar-footer">
                <div class="flex items-center gap-3 p-3 bg-bg-alt rounded-xl">
                    <div class="w-10 h-10 bg-gradient-to-br from-primary to-primary-dark rounded-full flex items-center justify-center text-white font-bold shrink-0 text-sm shadow-sm"
                        data-admin-initial>A</div>
                    <div class="flex-1 min-w-0">
                        <p class="text-sm font-bold text-text truncate">Admin</p>
                        <p class="text-xs text-text-muted truncate" data-admin-email>Signed in</p>
                    </div>
                    <button type="button" data-logout class="p-2 text-text-muted hover:text-error transition-colors"
                        title="Log out" aria-label="Log out">
                        <svg width="18" height="18" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                        </svg>
                    </button>
                </div>
            </div>
        </aside>

        <!-- ========== MAIN ========== -->
        <main class="min-w-0">
            <header class="sticky top-0 z-30 glass border-b border-border">
                <div class="flex items-center justify-between gap-3 px-4 md:px-6 py-4">
                    <div class="flex items-center gap-3 min-w-0">
                        <button type="button" data-sidebar-toggle
                            class="mobile-menu-btn p-2 hover:bg-bg-alt rounded-lg transition-colors"
                            aria-label="Open menu">
                            <svg width="18" height="18" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                                aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M4 6h16M4 12h16M4 18h16" />
                            </svg>
                        </button>
                        <div class="min-w-0">
                            <h1 class="font-serif text-xl md:text-2xl font-bold text-text truncate">Order Dashboard
                            </h1>
                            <p class="text-xs md:text-sm text-text-muted flex items-center gap-1.5">
                                <span class="w-1.5 h-1.5 rounded-full bg-success animate-pulse"></span>
                                Live updates
                            </p>
                        </div>
                    </div>

                    <div class="flex items-center gap-2">
                        <div class="relative hidden md:block">
                            <svg width="18" height="18" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-text-muted" fill="none"
                                stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                            </svg>
                            <label for="order-search" class="sr-only">Search orders</label>
                            <input type="search" id="order-search" placeholder="Name, phone or order code…"
                                class="w-64 pl-10 pr-4 py-2.5 border border-border-strong rounded-xl text-sm outline-none focus:border-primary focus:ring-4 focus:ring-primary-subtle transition-all bg-surface">
                        </div>
                        <button type="button" id="export-csv" class="btn btn-secondary btn-sm inline-flex"
                            title="Download the filtered orders as CSV" aria-label="Export orders as CSV">
                            <svg width="18" height="18" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                                aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                            </svg>
                            <span class="hidden sm:inline">Export</span>
                        </button>
                        <button type="button" id="refresh-orders" class="icon-btn" aria-label="Refresh orders">
                            <svg width="18" height="18" id="refresh-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                                aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                            </svg>
                        </button>
                    </div>
                </div>
            </header>

            <div class="p-4 md:p-6 max-w-[1500px]">

                <!-- Stats -->
                <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 md:gap-5 mb-7">
                    <div class="stat-card">
                        <div class="w-9 h-9 bg-success-light rounded-xl flex items-center justify-center mb-3">
                            <svg width="18" height="18" class="w-5 h-5 text-success-dark" fill="none" stroke="currentColor"
                                viewBox="0 0 24 24" aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                            </svg>
                        </div>
                        <p class="stat-label">Delivered revenue</p>
                        <p class="stat-value" id="total-revenue">৳ 0</p>
                    </div>

                    <div class="stat-card">
                        <div class="w-9 h-9 bg-warning-light rounded-xl flex items-center justify-center mb-3">
                            <svg width="18" height="18" class="w-5 h-5 text-warning-dark" fill="none" stroke="currentColor"
                                viewBox="0 0 24 24" aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                            </svg>
                        </div>
                        <p class="stat-label">Pending</p>
                        <p class="stat-value warning" id="pending-count">0</p>
                    </div>

                    <div class="stat-card">
                        <div class="w-9 h-9 bg-accent-light rounded-xl flex items-center justify-center mb-3">
                            <svg width="18" height="18" class="w-5 h-5 text-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                                aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01" />
                            </svg>
                        </div>
                        <p class="stat-label">All orders</p>
                        <p class="stat-value" id="total-orders">0</p>
                    </div>

                    <div class="stat-card">
                        <div class="w-9 h-9 bg-primary-subtle rounded-xl flex items-center justify-center mb-3">
                            <svg width="18" height="18" class="w-5 h-5 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                                aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                            </svg>
                        </div>
                        <p class="stat-label">Today</p>
                        <p class="stat-value primary" id="today-count">0</p>
                    </div>
                </div>

                <!-- Filters -->
                <div class="panel p-4 mb-6 space-y-4">
                    <div class="flex flex-wrap items-center gap-3">
                        <span class="text-[10px] font-bold text-text-muted uppercase tracking-[0.14em]">Period</span>
                        <div class="date-pills">
                            <button type="button" class="date-pill active" data-range="all">All time</button>
                            <button type="button" class="date-pill" data-range="today">Today</button>
                            <button type="button" class="date-pill" data-range="week">Last 7 days</button>
                            <button type="button" class="date-pill" data-range="month">This month</button>
                        </div>
                    </div>

                    <div class="relative md:hidden">
                        <svg width="18" height="18" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-text-muted" fill="none"
                            stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                        </svg>
                        <label for="order-search-mobile" class="sr-only">Search orders</label>
                        <input type="search" id="order-search-mobile" placeholder="Search orders…"
                            class="w-full pl-10 pr-4 py-2.5 border border-border-strong rounded-xl text-sm outline-none focus:border-primary focus:ring-4 focus:ring-primary-subtle transition-all bg-surface">
                    </div>

                    <div class="chip-row items-center gap-5 border-b border-border" role="tablist"
                        aria-label="Order status">
                        <button type="button" class="filter-tab active" data-filter="all" role="tab"
                            aria-selected="true">All</button>
                        <button type="button" class="filter-tab" data-filter="pending" role="tab"
                            aria-selected="false">
                            Pending
                            <span id="tab-pending-count"
                                class="ml-1.5 bg-warning text-white text-[10px] font-bold px-2 py-0.5 rounded-full hidden">0</span>
                        </button>
                        <button type="button" class="filter-tab" data-filter="delivered" role="tab"
                            aria-selected="false">Delivered</button>
                        <button type="button" class="filter-tab" data-filter="cancelled" role="tab"
                            aria-selected="false">Cancelled</button>
                    </div>
                </div>

                <!-- Orders -->
                <div id="orders-container" aria-live="polite">
                    <div class="space-y-3">
                        <div class="panel p-6">
                            <div class="flex items-center gap-4">
                                <div class="skeleton w-12 h-12 rounded-full"></div>
                                <div class="flex-1">
                                    <div class="skeleton w-48 h-5 rounded mb-2"></div>
                                    <div class="skeleton w-32 h-4 rounded"></div>
                                </div>
                                <div class="skeleton w-24 h-8 rounded-full"></div>
                            </div>
                        </div>
                        <div class="panel p-6">
                            <div class="flex items-center gap-4">
                                <div class="skeleton w-12 h-12 rounded-full"></div>
                                <div class="flex-1">
                                    <div class="skeleton w-40 h-5 rounded mb-2"></div>
                                    <div class="skeleton w-28 h-4 rounded"></div>
                                </div>
                                <div class="skeleton w-24 h-8 rounded-full"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- ========== CONFIRM MODAL ========== -->
    <div id="confirm-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="confirm-title"
        aria-hidden="true">
        <div class="absolute inset-0" data-confirm-close aria-hidden="true"></div>
        <div class="modal-content relative !max-w-sm p-6 text-center">
            <div id="confirm-icon" class="w-16 h-16 mx-auto mb-4 rounded-full flex items-center justify-center"></div>
            <h2 id="confirm-title" class="font-serif text-lg font-bold text-text mb-2"></h2>
            <p id="confirm-message" class="text-sm text-text-secondary mb-6"></p>
            <div class="flex gap-3">
                <button type="button" data-confirm-close class="btn btn-secondary flex-1">Cancel</button>
                <button type="button" id="confirm-action" class="btn btn-primary flex-1">Confirm</button>
            </div>
        </div>
    </div>

    <div id="toast-container" role="status" aria-live="polite"></div>

    <script type="module" src="js/auth_guard.js"></script>
    <script type="module" src="js/admin-shell.js"></script>
    <script type="module" src="js/orders.js"></script>
</body>

</html>
