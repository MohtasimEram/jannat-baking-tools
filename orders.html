<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Dashboard - Jannat Baking</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: { DEFAULT: '#E85A4F', dark: '#C94A40', light: '#F5A5A0', subtle: '#FEF2F1' },
                        secondary: { DEFAULT: '#D4A574', dark: '#B88B5E', light: '#E8D4BC' },
                        accent: { DEFAULT: '#4A90A4', light: '#E8F4F7' },
                        surface: '#FFFFFF',
                        background: '#FFFBF7',
                        'bg-alt': '#FDF8F3',
                        border: '#F0E6DC',
                        text: { DEFAULT: '#2D2420', secondary: '#6B5B52', muted: '#A89B93' },
                        success: { DEFAULT: '#22C55E', light: '#DCFCE7' },
                        warning: { DEFAULT: '#F59E0B', light: '#FEF3C7' },
                        error: { DEFAULT: '#EF4444', light: '#FEE2E2' }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        serif: ['Playfair Display', 'Georgia', 'serif'],
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-background text-text font-sans">
    
    <div id="sidebar-overlay" class="sidebar-overlay" onclick="toggleSidebar()"></div>
    
    <div class="dashboard-grid">
        <aside id="sidebar" class="sidebar flex flex-col">
            <div class="p-6 border-b border-border">
                <a href="index.html" class="flex flex-col">
                    <h1 class="font-serif text-xl font-bold text-text">
                        <span class="text-primary italic">Jannat</span> Baking
                    </h1>
                    <span class="text-xs text-text-muted tracking-wider uppercase">Admin Panel</span>
                </a>
            </div>
            
            <nav class="flex-1 py-4">
                <div class="px-4 mb-2 text-xs font-semibold text-text-muted uppercase tracking-wider">Main</div>
                <a href="orders.html" class="nav-item active flex items-center gap-3 px-6 py-3 text-sm font-medium">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/>
                    </svg>
                    Orders
                    <span id="pending-badge" class="ml-auto bg-primary text-white text-xs font-bold px-2 py-0.5 rounded-full hidden">0</span>
                </a>
                <a href="admin.html" class="nav-item flex items-center gap-3 px-6 py-3 text-sm font-medium text-text-secondary hover:text-text hover:bg-bg-alt">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/>
                    </svg>
                    Products
                </a>
                
                <div class="px-4 mt-6 mb-2 text-xs font-semibold text-text-muted uppercase tracking-wider">Settings</div>
                <a href="index.html" class="nav-item flex items-center gap-3 px-6 py-3 text-sm font-medium text-text-secondary hover:text-text hover:bg-bg-alt">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                    </svg>
                    View Shop
                </a>
            </nav>
            
            <div class="p-4 border-t border-border">
                <div class="flex items-center gap-3 p-3 bg-bg-alt rounded-xl">
                    <div class="w-10 h-10 bg-gradient-to-br from-primary to-primary-dark rounded-full flex items-center justify-center text-white font-bold">
                        A
                    </div>
                    <div class="flex-1 min-w-0">
                        <p class="text-sm font-semibold text-text truncate">Admin User</p>
                        <p class="text-xs text-text-muted truncate">admin@jannatbaking.com</p>
                    </div>
                    <button onclick="logout()" class="p-2 text-text-muted hover:text-error transition-colors" title="Logout">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                        </svg>
                    </button>
                </div>
            </div>
        </aside>
        
        <main class="flex-1 overflow-auto">
            <header class="sticky top-0 z-30 bg-background/80 backdrop-blur-lg border-b border-border">
                <div class="flex items-center justify-between px-6 py-4">
                    <div class="flex items-center gap-4">
                        <button onclick="toggleSidebar()" class="mobile-menu-btn p-2 hover:bg-bg-alt rounded-lg transition-colors">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                            </svg>
                        </button>
                        <div>
                            <h2 class="font-serif text-2xl font-bold text-text">Order Dashboard</h2>
                            <p class="text-sm text-text-muted">Manage and track all your orders</p>
                        </div>
                    </div>
                    
                    <div class="flex items-center gap-3">
                        <!-- Search Orders -->
                        <div class="relative hidden md:block">
                            <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-text-muted" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                            </svg>
                            <input type="text" id="order-search" placeholder="Search by name or phone..." oninput="searchOrders()"
                                class="pl-10 pr-4 py-2 border border-border rounded-xl text-sm text-text outline-none focus:border-primary focus:ring-4 focus:ring-primary-subtle transition-all w-60">
                        </div>
                        <button onclick="refreshOrders()" class="p-2.5 bg-surface border border-border rounded-xl hover:border-primary hover:text-primary transition-colors" title="Refresh">
                            <svg id="refresh-icon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                            </svg>
                        </button>
                    </div>
                </div>
            </header>
            
            <div class="p-6">
                <!-- Stats Grid (4 cards now) -->
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 md:gap-6 mb-8">
                    <div class="stat-card bg-surface rounded-2xl p-5 border border-border">
                        <div class="flex items-center justify-between mb-3">
                            <div class="w-10 h-10 bg-success/10 rounded-xl flex items-center justify-center">
                                <svg class="w-5 h-5 text-success" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                                </svg>
                            </div>
                        </div>
                        <p class="text-xs text-text-muted mb-1 uppercase tracking-wider font-semibold">Revenue</p>
                        <p id="total-revenue" class="font-serif text-2xl font-bold text-text">৳ 0</p>
                    </div>
                    
                    <div class="stat-card bg-surface rounded-2xl p-5 border border-border">
                        <div class="flex items-center justify-between mb-3">
                            <div class="w-10 h-10 bg-warning/10 rounded-xl flex items-center justify-center">
                                <svg class="w-5 h-5 text-warning" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                                </svg>
                            </div>
                        </div>
                        <p class="text-xs text-text-muted mb-1 uppercase tracking-wider font-semibold">Pending</p>
                        <p id="pending-count" class="font-serif text-2xl font-bold text-warning">0</p>
                    </div>
                    
                    <div class="stat-card bg-surface rounded-2xl p-5 border border-border">
                        <div class="flex items-center justify-between mb-3">
                            <div class="w-10 h-10 bg-accent/10 rounded-xl flex items-center justify-center">
                                <svg class="w-5 h-5 text-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/>
                                </svg>
                            </div>
                        </div>
                        <p class="text-xs text-text-muted mb-1 uppercase tracking-wider font-semibold">All Orders</p>
                        <p id="total-orders" class="font-serif text-2xl font-bold text-text">0</p>
                    </div>

                    <div class="stat-card bg-surface rounded-2xl p-5 border border-border">
                        <div class="flex items-center justify-between mb-3">
                            <div class="w-10 h-10 bg-primary/10 rounded-xl flex items-center justify-center">
                                <svg class="w-5 h-5 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                                </svg>
                            </div>
                        </div>
                        <p class="text-xs text-text-muted mb-1 uppercase tracking-wider font-semibold">Today</p>
                        <p id="today-count" class="font-serif text-2xl font-bold text-primary">0</p>
                    </div>
                </div>

                <!-- Date Filter Pills -->
                <div class="flex flex-wrap items-center gap-4 mb-6">
                    <span class="text-xs font-semibold text-text-muted uppercase tracking-wider">Period:</span>
                    <div class="date-pills">
                        <button class="date-pill active" data-range="all" onclick="filterByDate('all')">All Time</button>
                        <button class="date-pill" data-range="today" onclick="filterByDate('today')">Today</button>
                        <button class="date-pill" data-range="week" onclick="filterByDate('week')">This Week</button>
                        <button class="date-pill" data-range="month" onclick="filterByDate('month')">This Month</button>
                    </div>
                </div>
                
                <!-- Status Filter Tabs -->
                <div class="flex flex-wrap items-center gap-6 mb-6 border-b border-border">
                    <button onclick="filterOrders('all')" class="filter-tab active pb-3 text-sm font-medium text-text-secondary hover:text-text" data-filter="all">
                        All Orders
                    </button>
                    <button onclick="filterOrders('pending')" class="filter-tab pb-3 text-sm font-medium text-text-secondary hover:text-text" data-filter="pending">
                        Pending
                        <span id="tab-pending-count" class="ml-1.5 bg-warning text-white text-xs font-bold px-2 py-0.5 rounded-full hidden">0</span>
                    </button>
                    <button onclick="filterOrders('delivered')" class="filter-tab pb-3 text-sm font-medium text-text-secondary hover:text-text" data-filter="delivered">
                        Delivered
                    </button>
                    <button onclick="filterOrders('cancelled')" class="filter-tab pb-3 text-sm font-medium text-text-secondary hover:text-text" data-filter="cancelled">
                        Cancelled
                    </button>
                </div>

                <!-- Mobile search (visible only on small screens) -->
                <div class="relative md:hidden mb-4">
                    <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-text-muted" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                    </svg>
                    <input type="text" id="order-search-mobile" placeholder="Search orders..." oninput="searchOrders()"
                        class="w-full pl-10 pr-4 py-2.5 border border-border rounded-xl text-sm text-text outline-none focus:border-primary focus:ring-4 focus:ring-primary-subtle transition-all">
                </div>
                
                <div id="orders-container">
                    <div class="space-y-4">
                        <div class="bg-surface rounded-2xl p-6 border border-border">
                            <div class="flex items-center gap-4">
                                <div class="skeleton w-12 h-12 rounded-full"></div>
                                <div class="flex-1">
                                    <div class="skeleton w-48 h-5 rounded mb-2"></div>
                                    <div class="skeleton w-32 h-4 rounded"></div>
                                </div>
                                <div class="skeleton w-24 h-8 rounded-full"></div>
                            </div>
                        </div>
                        <div class="bg-surface rounded-2xl p-6 border border-border">
                            <div class="flex items-center gap-4">
                                <div class="skeleton w-12 h-12 rounded-full"></div>
                                <div class="flex-1">
                                    <div class="skeleton w-48 h-5 rounded mb-2"></div>
                                    <div class="skeleton w-32 h-4 rounded"></div>
                                </div>
                                <div class="skeleton w-24 h-8 rounded-full"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <div id="confirm-modal" class="fixed inset-0 z-[100] flex items-center justify-center p-4 opacity-0 invisible transition-all duration-300">
        <div class="absolute inset-0 bg-text/50 backdrop-blur-sm" onclick="closeConfirmModal()"></div>
        <div class="relative bg-surface rounded-2xl shadow-2xl p-6 max-w-sm w-full transform scale-95 transition-transform duration-300">
            <div class="text-center">
                <div id="confirm-icon" class="w-16 h-16 mx-auto mb-4 rounded-full flex items-center justify-center">
                    </div>
                <h3 id="confirm-title" class="font-serif text-xl font-bold text-text mb-2"></h3>
                <p id="confirm-message" class="text-text-secondary text-sm mb-6"></p>
                <div class="flex gap-3">
                    <button onclick="closeConfirmModal()" class="flex-1 py-3 border-2 border-border rounded-xl font-semibold text-text-secondary hover:border-text hover:text-text transition-colors">
                        Cancel
                    </button>
                    <button id="confirm-action" class="flex-1 py-3 bg-primary text-white rounded-xl font-semibold hover:bg-primary-dark transition-colors">
                        Confirm
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <div id="toast-container" class="fixed bottom-6 right-6 z-[200] flex flex-col gap-3"></div>
    
    <script type="module" src="js/auth_guard.js"></script>
    <script type="module" src="js/orders.js"></script>
</body>
</html>
